<!doctype html>
<html lang="en">
<head>
    <title>Weather App</title>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-image:
        linear-gradient(
            rgba(5, 15, 35, 0.45),
            rgba(5, 15, 35, 0.45)
        ),
        url("./img/weather.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: white;
    overflow: hidden;
}

.weather-wrapper {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.weather-container {
    width: 100%;
    max-width: 900px;
    height: 510px;
    padding: 18px;
    border-radius: 25px;
    background:
        rgba(255, 255, 255, 0.075);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(5px);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 11px;
    flex-shrink: 0;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
}

.logo-icon {
    width: 39px;
    height: 39px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.10);
    color: #ffd86b;
    font-size: 20px;
}

.logo-text h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
}

.logo-text p {
    margin: 1px 0 0;
    color: #98a7c2;
    font-size: 10px;
}

.live {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 30px;
    background: rgba(70, 220, 135, 0.10);
    color: #62df98;
    font-size: 10px;
    font-weight: 600;
}

.live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #54dc8c;
}

.search-box {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    padding: 4px;
    margin-bottom: 11px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.10);
    flex-shrink: 0;
}

.search-icon {
    width: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8f9db7;
    font-size: 15px;
}

.search-box input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 13px;
}

.search-box input::placeholder {
    color: #8795b0;
}


.search-box button {
    height: 34px;
    padding: 0 19px;
    border: none;
    border-radius: 9px;
    background: #5c8dff;
    color: white;
    font-size: 12px;
    font-weight: 600;
}

.search-box button:hover {
    background: #4c7ded;
}

.weather-main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 11px;
}

.weather-left {
    flex: 1.15;
    min-width: 0;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    padding: 20px;
    background:
        linear-gradient(
            145deg,
            rgba(91, 140, 255, 0.10),
            rgba(91, 140, 255, 0.05)
        );
    border: 1px solid rgba(255, 255, 255, 0.10);
    display: flex;
    flex-direction: column;
}

.weather-left::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(90, 142, 255, 0.10);
    top: -80px;
    right: -60px;
}

.weather-left::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(80, 120, 255, 0.07);
    bottom: -65px;
    left: -50px;
}

.location {
    position: relative;
    z-index: 2;
}

.city-name {
    font-size: 21px;
    line-height: 1.2;
    font-weight: 700;
    color: white;
}

.city-name i {
    color: #78a4ff;
    font-size: 15px;
    margin-right: 3px;
}

.weather-date {
    margin-top: 4px;
    color: #98a7c0;
    font-size: 10px;
}

.main-temperature {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
    z-index: 2;
}

.weather-icon {
    font-size: 58px;
    line-height: 1;
    margin-bottom: 7px;
}

.temperature {
    font-size: 62px;
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -2px;
}

.weather-condition {
    margin-top: 7px;
    font-size: 15px;
    font-weight: 600;
    color: #dce6fa;
}

.feels-like {
    margin-top: 3px;
    font-size: 10px;
    color: #98a8c2;
}

.weather-right {
    flex: 0.85;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.info-title {
    color: #a0aec7;
    font-size: 10px;
    font-weight: 600;
    padding-left: 2px;
    flex-shrink: 0;
}

.details {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.detail-card {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    padding: 10px 13px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.065);
    border: 1px solid rgba(255, 255, 255, 0.09);
}

.detail-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 11px;
    border-radius: 10px;
    background: rgba(91, 140, 255, 0.14);
    color: #7ca4ff;
    font-size: 15px;
}

.detail-title {
    color: #8796b1;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
}

.detail-value {
    color: white;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
}

@media (max-height: 650px) {

    .weather-container {
        height: 480px;
        padding: 15px;
    }

    .weather-left {
        padding: 17px;
    }

    .weather-icon {
        font-size: 52px;
    }

    .temperature {
        font-size: 56px;
    }

    .detail-card {
        padding: 8px 11px;
    }
}

@media (max-width: 800px) {

    body {
        overflow: auto;
    }

    .weather-wrapper {
        height: auto;
        min-height: 100vh;
        padding: 10px;
    }

    .weather-container {
        height: auto;
        max-width: 600px;
        padding: 15px;
    }

    .weather-main {
        flex-direction: column;
    }

    .weather-left {
        min-height: 330px;
    }

    .weather-right {
        min-height: 290px;
    }
}

@media (max-width: 500px) {

    .weather-container {
        padding: 12px;
        border-radius: 19px;
    }

    .logo-icon {
        width: 36px;
        height: 36px;
        font-size: 18px;
    }

    .logo-text h1 {
        font-size: 17px;
    }

    .logo-text p {
        display: none;
    }

    .live {
        font-size: 9px;
        padding: 5px 8px;
    }

    .search-box {
        height: 43px;
    }

    .search-box button {
        height: 33px;
        padding: 0 14px;
    }

    .weather-left {
        padding: 18px;
        min-height: 310px;
    }

    .city-name {
        font-size: 19px;
    }

    .weather-icon {
        font-size: 52px;
    }

    .temperature {
        font-size: 52px;
    }
}
</style>
</head>

<body>

<div class="weather-wrapper">
    <div class="weather-container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="bi bi-cloud-sun-fill"></i>
                </div>
                <div class="logo-text">
                    <h1>Weather App</h1>
                    <p>Live weather information</p>
                </div>
            </div>
            <div class="live">
                <span class="live-dot"></span>
                Live Data
            </div>
        </div>

        <div class="search-box">
            <div class="search-icon">
                <i class="bi bi-search"></i>
            </div>
            <input
                type="text"
                id="city"
                placeholder="Search city name..."
            >
            <button id="searchBtn">
                <i class="bi bi-search me-1"></i>
                Search
            </button>
        </div>

        <div class="weather-main">

            <div class="weather-left">
                <div class="location">
                    <div class="city-name">
                        <i class="bi bi-geo-alt-fill"></i>
                        Search a city
                    </div>
                    <div class="weather-date">
                        Enter a city to see current weather
                    </div>
                </div>

                <div class="main-temperature">
                    <div class="weather-icon">
                        🌤️
                    </div>
                    <div class="temperature">
                        --°C
                    </div>
                    <div class="weather-condition">
                        --
                    </div>
                    <div class="feels-like">
                        Feels like --°C
                    </div>
                </div>
            </div>

            <div class="weather-right">
                <div class="info-title">
                    Weather Details
                </div>
                <div class="details">
                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="bi bi-droplet-fill"></i>
                        </div>
                        <div>
                            <div class="detail-title">
                                HUMIDITY
                            </div>
                            <div class="detail-value">
                                --
                            </div>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="bi bi-wind"></i>
                        </div>
                        <div>
                            <div class="detail-title">
                                WIND SPEED
                            </div>
                            <div class="detail-value">
                                --
                            </div>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="bi bi-speedometer2"></i>
                        </div>
                        <div>
                            <div class="detail-title">
                                PRESSURE
                            </div>
                            <div class="detail-value">
                                --
                            </div>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="bi bi-eye-fill"></i>
                        </div>
                        <div>
                            <div class="detail-title">
                                VISIBILITY
                            </div>
                            <div class="detail-value">
                                --
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="./script.js"></script>
</body>
</html>
